name: Deploy to App Store & Google Play 🚀

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install --legacy-peer-deps
      - name: Build Web App
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_REVENUECAT_APPLE_KEY: ${{ secrets.VITE_REVENUECAT_APPLE_KEY }}
          VITE_REVENUECAT_GOOGLE_KEY: ${{ secrets.VITE_REVENUECAT_GOOGLE_KEY }}
          VITE_TMB_APP_ID: ${{ secrets.VITE_TMB_APP_ID }}
          VITE_TMB_APP_KEY: ${{ secrets.VITE_TMB_APP_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          retention-days: 1

  deploy-ios:
    needs: build-web
    runs-on: macos-15 # Latest macOS runner with iOS 18 SDK
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --legacy-peer-deps

      - name: Capacitor Sync
        run: npx cap sync ios

      - name: Increment Build Number
        run: |
          chmod +x scripts/increment-build.sh
          ./scripts/increment-build.sh

      - name: Verify Bundle Identifier
        run: |
          echo "🔍 Verifying identifiers..."
          XCODE_ID=$(grep "PRODUCT_BUNDLE_IDENTIFIER =" ios/App/App.xcodeproj/project.pbxproj | head -n 1 | sed 's/.*= \(.*\);/\1/')
          echo "  - Xcode Project Bundle ID: $XCODE_ID"
          if [ "$XCODE_ID" != "com.vibecode.redcarpet" ]; then
            echo "❌ ERROR: Bundle ID mismatch! Expected com.vibecode.redcarpet but found $XCODE_ID"
            exit 1
          fi
          echo "✅ Bundle ID verified!"

      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
        env:
          LANG: en_US.UTF-8
          LC_ALL: en_US.UTF-8

      - name: Import Code Signing Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APP_STORE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APP_STORE_CERTIFICATE_PASSWORD }}
          create-keychain: true
          keychain-password: ${{ secrets.APP_STORE_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profiles & resolve their names
        id: profiles
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          # Main app profile (com.vibecode.redcarpet)
          echo "${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/app.mobileprovision
          APP_UUID=$(security cms -D -i /tmp/app.mobileprovision | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          APP_NAME=$(security cms -D -i /tmp/app.mobileprovision | plutil -extract Name xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp /tmp/app.mobileprovision "$PROFILES_DIR/$APP_UUID.mobileprovision"
          echo "app_profile_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "  - App profile: $APP_NAME ($APP_UUID)"

          # Widget extension profile (com.vibecode.redcarpet.SOSWidgetExtension)
          echo "${{ secrets.WIDGET_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > /tmp/widget.mobileprovision
          WIDGET_UUID=$(security cms -D -i /tmp/widget.mobileprovision | plutil -extract UUID xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          WIDGET_NAME=$(security cms -D -i /tmp/widget.mobileprovision | plutil -extract Name xml1 -o - - | sed -n 's/.*<string>\(.*\)<\/string>.*/\1/p')
          cp /tmp/widget.mobileprovision "$PROFILES_DIR/$WIDGET_UUID.mobileprovision"
          echo "widget_profile_name=$WIDGET_NAME" >> "$GITHUB_OUTPUT"
          echo "  - Widget profile: $WIDGET_NAME ($WIDGET_UUID)"

      - name: Inject profile names into ExportOptions.plist
        run: |
          sed -i '' "s/__APP_PROFILE_NAME__/${{ steps.profiles.outputs.app_profile_name }}/" ios/App/App/ExportOptions.plist
          sed -i '' "s/__WIDGET_PROFILE_NAME__/${{ steps.profiles.outputs.widget_profile_name }}/" ios/App/App/ExportOptions.plist

      - name: Switch to manual signing for Release (App Store distribution)
        run: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          sed -i '' \
            -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
            -e 's/CODE_SIGN_IDENTITY = "iPhone Developer";/CODE_SIGN_IDENTITY = "Apple Distribution";/g' \
            "$PBXPROJ"

      - name: Build & Submit to App Store via Fastlane
        run: bundle exec fastlane ios deploy
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_KEY_CONTENT }}

  deploy-android:
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm install --legacy-peer-deps

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Decode keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Write keystore.properties
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build & Publish to Google Play via Fastlane
        run: bundle exec fastlane android deploy
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
